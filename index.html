<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SipStreak</title>

    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.cdnfonts.com/css/glacial-indifference-2" rel="stylesheet">
</head>
<body>

    <div class="container">

        <!-- HEADER -->
        <header class="app-header">
            <div class="logo-container">
                <img src="assets/Logo.png" alt="SipStreak Logo" class="logo">
            </div>
        </header>

        <!-- SETUP CARD -->
        <section class="card">
            <h2>Create Your Hydration Plan</h2>

            <div class="form-grid">

                <div class="input-group">
                    <label>Weight</label>
                    <input type="number" id="weight" placeholder="Enter weight">
                </div>

                <div class="input-group">
                    <label>Unit</label>
                    <select id="unit">
                        <option value="lbs">lbs</option>
                        <option value="kg">kg</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Bottle Size</label>
                    <input type="number" id="bottleSize" placeholder="e.g. 32">
                </div>

                <div class="input-group">
                    <label>Measurement</label>
                    <select id="measurement">
                        <option value="oz">oz</option>
                        <option value="ml">ml</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Wake Up</label>
                    <input type="time" id="wakeTime">
                </div>

                <div class="input-group">
                    <label>Sleep Time</label>
                    <input type="time" id="sleepTime">
                </div>

            </div>

            <button id="calculateBtn">
                Calculate My Plan
            </button>
        </section>

        <!-- DASHBOARD -->
        <section class="card dashboard">

            <h2>Today's Progress</h2>

            <div class="progress-wrapper">

                <div class="progress-circle">
                    <div class="progress-inner">
                        <span id="progressPercent">0%</span>
                    </div>
                </div>

                <div class="goal-info">
                    <h3 id="dailyGoal">Daily Goal: --</h3>
                    <p id="bottleCount">0 / 0 Bottles Complete</p>
                </div>

            </div>

        </section>

        <!-- SCHEDULE -->
        <section class="card">
            <h2>Your Bottle Schedule</h2>

            <ul id="scheduleList" class="schedule-list">

                <!-- JS will populate -->

                <li class="placeholder">
                    Your schedule will appear here
                </li>

            </ul>
        </section>

    </div>

    <script src="app.js"></script>
</body>
</html>
